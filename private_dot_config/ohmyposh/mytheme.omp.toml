console_title_template = "{{ .Shell }} in {{ .Folder }}"
version = 4
final_space = true

[secondary_prompt]
template = "❯❯ "
foreground = "green"

[transient_prompt]
template = "❯ "
foreground_templates = ["{{if gt .Code 0}}red{{end}}", "{{if eq .Code 0}}green{{end}}"]

[[blocks]]
type = "prompt"
alignment = "left"

[[blocks.segments]]
template = " 󰉋  {{ path .Path .Location }}"
foreground = "blue"
type = "path"
style = "plain"

[blocks.segments.properties]
style = "full"

[[blocks.segments]]
template = " {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} "
foreground = "green"
type = "git"
style = "plain"
foreground_templates = ["{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}", "{{ if and (gt .Ahead 0) (gt .Behind 0) }}red{{ end }}", "{{ if gt .Ahead 0 }}magenta{{ end }}", "{{ if gt .Behind 0 }}magenta{{ end }}"]

[blocks.segments.properties]
branch_icon = " 󰘬 "

[[blocks]]
type = "rprompt"
overflow = "hide"

[[blocks.segments]]
template = "  {{ .FormattedMs }} "
foreground = "magenta"
type = "executiontime"
style = "plain"

[[blocks.segments]]
template = ' {{ .CurrentDate | date "03:04 PM" }} '
foreground = "blue"
type = "time"
style = "plain"

[[blocks.segments]]
foreground = "cyan"
template = "{{if .SSHSession}} {{.HostName}}{{end}}"
type = "session"
style = "plain"
